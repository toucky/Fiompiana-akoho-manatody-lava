name: Temp Laoka APK delivery
on:
  push:
    branches:
      - tmp-laoka-delivery-20260903
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-laoka-delivery-20260903
      - name: Download and verify installable Laoka APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 \
            'https://xvwsdoqiesnqpyrqahwf.supabase.co/storage/v1/object/public/app-mada-apks/TEST-Laoka-Isanandro-INSTALLABLE-SANS-ID-APPAREIL.apk' \
            -o 'Laoka-Isanandro-APP-MADA-INSTALLABLE-SANS-ID-APPAREIL.apk'
          echo 'fd8cc04ef1d7a84caab1c98eb4e6d197d7d373d8a6179c668df1ccedde399253  Laoka-Isanandro-APP-MADA-INSTALLABLE-SANS-ID-APPAREIL.apk' | sha256sum -c -
      - name: Commit APK to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'APP MADA Delivery'
          git config user.email 'actions@users.noreply.github.com'
          git add Laoka-Isanandro-APP-MADA-INSTALLABLE-SANS-ID-APPAREIL.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Temp: livrer APK Laoka installable sans ID appareil'
          git push origin HEAD:tmp-laoka-delivery-20260903
