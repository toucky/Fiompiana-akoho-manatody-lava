name: Temp Laoka APK delivery
on:
  push:
    branches:
      - tmp-laoka-delivery-20260903
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-laoka-delivery-20260903
      - name: Download and verify installable Laoka APK v2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 \
            'https://xvwsdoqiesnqpyrqahwf.supabase.co/storage/v1/object/public/app-mada-apks/TEST-Laoka-Isanandro-INSTALLABLE-V2-SANS-ID-APPAREIL.apk' \
            -o 'Laoka-Isanandro-APP-MADA-INSTALLABLE-V2-SANS-ID-APPAREIL.apk'
          echo 'b9c64cdb86678c1ceb5ede4e3d18921dc972bac2d9572c5048159a423a39a1bc  Laoka-Isanandro-APP-MADA-INSTALLABLE-V2-SANS-ID-APPAREIL.apk' | sha256sum -c -
      - name: Verify with Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          APK='Laoka-Isanandro-APP-MADA-INSTALLABLE-V2-SANS-ID-APPAREIL.apk'
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Commit APK to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'APP MADA Delivery'
          git config user.email 'actions@users.noreply.github.com'
          git add Laoka-Isanandro-APP-MADA-INSTALLABLE-V2-SANS-ID-APPAREIL.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Temp: livrer APK Laoka installable v2'
          git push origin HEAD:tmp-laoka-delivery-20260903
